[project]
name = "banking-transaction-system"
version = "0.1.0"
description = "Banking Transaction Processing System built with DDD and Hexagonal Architecture"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Mahshad Azizi", email = "Azizi.mhshd@gmail.com" }
]

dependencies = [
    # API
    "fastapi==0.121.0",
    "uvicorn[standard]==0.38.0",

    # Validation & configuration
    "pydantic==2.12.4",
    "pydantic-settings==2.11.0",

    # Database
    "SQLAlchemy==2.0.44",
    "asyncpg==0.30.0",
    "alembic==1.17.1",
    "greenlet==3.4.0",
    "Mako==1.3.10",

    # Cache / messaging
    "redis==8.0.0",

    # Dependency injection
    "dependency-injector==4.48.2",

    # Structured logging
    "structlog==24.1.0",
]

[project.optional-dependencies]
dev = [
    # Linting & formatting
    "ruff==0.14.4",
    "pre-commit==4.4.0",

    # Testing
    "pytest==8.4.0",
    "pytest-asyncio==1.1.0",
    "pytest-tornasync==0.6.0.post2",
    "pytest-trio==0.8.0",
    "pytest-twisted==1.14.3",
    "anyio==4.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = [
    "setuptools==80.9.0",
    "wheel==0.45.1",
]
build-backend = "setuptools.build_meta"
