version = "0.1.0"
description = "Banking Transaction Processing System — DDD + Hexagonal Architecture"
authors = ["Mahshad Azizi <Azizi.mhshd@gmail.com>"]
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.121.0",
    "uvicorn[standard]==0.38.0",

